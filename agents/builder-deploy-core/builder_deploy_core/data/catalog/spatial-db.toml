# author: Denson Smith
# §22 seed record — spatial-db. gcp_api: none -> natively skips S1 enablement.
# Validated fail-closed by dataload.load_catalog (§2.4.1).

service-id = "spatial-db"
gcp_api = "none"
category = "geospatial"

[[entries]]
kind = "db_extension"
name = "postgis"

# §25 detection_hints — ADDITIVE, ADVISORY (stoa--fdf inc 2.2; verbatim from prototype catalog_hints).
# load_catalog ignores it (byte-unchanged); load_detection_hints validates it. (§25.1 mis-propose-only.)
[detection_hints]
sdk_imports  = ["geoalchemy2", "shapely", "postgis"]
url_patterns = []
config_keys  = ["POSTGIS_ENABLE"]
data_signals = ["spatial-data", "geometry-column", "ST_ geo-query"]
